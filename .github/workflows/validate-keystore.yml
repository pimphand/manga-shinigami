name: Validate Keystore Secrets

# Tes cepat: pastikan 4 secret keystore cocok satu sama lain,
# TANPA build APK. Jalankan manual sebelum menerbitkan rilis:
# Actions > Validate Keystore Secrets > Run workflow (branch main).
#
# Workflow ini TIDAK mencetak password. Ia mencetak SHA256 keystore
# hasil decode + alias + masa berlaku — bandingkan dengan keystore
# lokal memakai:
#   shasum -a 256 release.keystore   (macOS)
#   keytool -list -v -keystore release.keystore -alias ALIAS_MU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-keystore:
    name: Check keystore secrets
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java (for keytool)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore & verify
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Secret ANDROID_KEYSTORE_BASE64 belum diisi.}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Secret ANDROID_KEYSTORE_PASSWORD belum diisi.}"
          : "${ANDROID_KEY_ALIAS:?Secret ANDROID_KEY_ALIAS belum diisi.}"
          : "${ANDROID_KEY_PASSWORD:?Secret ANDROID_KEY_PASSWORD belum diisi.}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/check.keystore
          test -s /tmp/check.keystore || {
            echo '::error::Hasil decode kosong — ANDROID_KEYSTORE_BASE64 bukan base64 yang valid.'
            exit 1
          }
          echo "Ukuran keystore: $(wc -c < /tmp/check.keystore) bytes"
          echo "SHA256 keystore: $(sha256sum /tmp/check.keystore | cut -d' ' -f1)"

          # Password keystore + alias benar? (gagal = salah satu salah)
          keytool -list -v \
            -keystore /tmp/check.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" 2>&1 | grep -E '^(Alias name|Creation date|Valid from|Entry type)' \
            || {
              echo '::error::Password keystore atau alias salah. Cek ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS.'
              exit 1
            }

          # Password key (biasanya sama dengan password keystore).
          if keytool -keypasswd \
            -keystore /tmp/check.keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -new "$ANDROID_KEY_PASSWORD" >/dev/null 2>&1; then
            echo 'Password key: COCOK'
          else
            echo '::error::ANDROID_KEY_PASSWORD salah untuk alias ini.'
            exit 1
          fi

          echo 'Semua secret keystore VALID dan saling cocok.'
          shred -u /tmp/check.keystore 2>/dev/null || rm -f /tmp/check.keystore
